[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-assistant"
version = "0.1.0"
description = "A command-line assistant for sourced stock market research."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-chroma",
    "langchain-openai",
    "langchain-text-splitters",
    "langchain-huggingface",
    "sentence-transformers",
    "pyyaml",
    "yfinance",
    "tavily-python",
    "python-dotenv",
]

[project.scripts]
market-research = "market_research.cli:main"
market-research-index = "market_research.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]
